[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediction-bot"
version = "0.1.0"
description = "Venue-agnostic prediction-market trading bot (Kalshi demo first) with paper trading"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "cryptography>=42",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.2,<3",
    "typer>=0.12,<1",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
pbot = "prediction_bot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/prediction_bot/cli.py" = ["B008"]  # typer.Option defaults are idiomatic
"src/prediction_bot/dashboard.py" = ["E501"]  # embedded HTML/JS template

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["prediction_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
