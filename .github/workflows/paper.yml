name: Paper trading

# Paper-trades against Kalshi's *public production* market data (real prices, no
# credentials, paper mode never places orders) and persists the SQLite ledger +
# report on the `paper-ledger` branch. The book scanner runs every 30 min (free on a
# public repo); each sportsbook run spends its pacer share of the quota left this
# month (~16/day on the 500 free tier; most runs pull 1 feed and about every third
# pulls 2). Skipped pulls are banked.
# Manual runs (no slot input) always include the sportsbook strategy.
#
# Scheduling (v5 Phase 6): GitHub drops 40-70% of scheduled slots, so a Cloudflare
# Worker (infra/cloudflare-trigger) dispatches this workflow at :17/:47 with
# inputs.slot. The schedule below stays as a fallback; when both fire, the second run
# sees the first in the ledger (`pbot slot-guard`) and stops before doing anything.
on:
  schedule:
    - cron: "17 */2 * * *"  # book scanner + sportsbook
    - cron: "47 * * * *"  # book scanner only
    - cron: "17 1-23/2 * * *"  # book scanner only
  workflow_dispatch:
    inputs:
      slot:
        description: "scanner or sportsbook (blank: a manual run with the sportsbook step)"
        required: false
        default: ""

concurrency:
  group: paper-ledger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Restore ledger branch
        run: |
          git fetch --depth=1 origin paper-ledger:paper-ledger 2>/dev/null || true
          mkdir -p ledger
          git show paper-ledger:paper.sqlite > ledger/paper.sqlite 2>/dev/null || true

      # Scheduled and Cloudflare-dispatched runs share one code path: the slot comes
      # from inputs.slot, else from the cron that fired. Manual runs skip the guard.
      - name: Slot guard
        id: guard
        env:
          PBOT_PAPER_DB_PATH: ledger/paper.sqlite
          SLOT: ${{ inputs.slot || (github.event.schedule == '17 */2 * * *' && 'sportsbook') || (github.event_name == 'schedule' && 'scanner') || '' }}
        run: |
          if [ -z "$SLOT" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          DECISION="$(pbot slot-guard --slot "$SLOT")"
          echo "slot $SLOT: $DECISION"
          echo "skip=$([ "$DECISION" = skip ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Run one paper cycle
        if: steps.guard.outputs.skip != 'true'
        env:
          PBOT_MODE: paper
          PBOT_RULES_VERSION: ${{ vars.PBOT_RULES_VERSION || 'v3' }}
          # Set the repo Variable to taker to force automatic maker-first off.
          PBOT_V3_EXECUTION: ${{ vars.PBOT_V3_EXECUTION || 'auto' }}
          PBOT_KALSHI_API_BASE: https://api.elections.kalshi.com/trade-api/v2
          PBOT_PAPER_DB_PATH: ledger/paper.sqlite
          # v1 strategies only (book_scanner and the sportsbook_arb/underdog_value
          # shadows). The v3 threshold is PBOT_V2_MIN_NET_EDGE below.
          PBOT_MIN_EDGE: "0.01"
          # Net edge after the taker fee that v2/v3 require (doubled below 40c, see
          # PBOT_V3_LOW_PRICE_THRESHOLD_MULTIPLIER in config.py).
          PBOT_V2_MIN_NET_EDGE: ${{ vars.PBOT_V2_MIN_NET_EDGE || '0.02' }}
          # DraftKings/FanDuel never set the fair; set the repo Variable to true to
          # let them act as the reference when no sharp book quotes (pre-v5 behavior).
          PBOT_V3_ALLOW_SOFT_REFERENCE: ${{ vars.PBOT_V3_ALLOW_SOFT_REFERENCE || 'false' }}
          # Entry window in hours before kickoff; also bounds feed planning.
          PBOT_ENTRY_WINDOW_MIN_HOURS: ${{ vars.PBOT_ENTRY_WINDOW_MIN_HOURS || '72' }}
          PBOT_ENTRY_WINDOW_MAX_HOURS: ${{ vars.PBOT_ENTRY_WINDOW_MAX_HOURS || '168' }}
          # Shadow-only T-6h / T-90m pulls for feeds that never reach the window;
          # set the cap Variable to 0 to stop them.
          PBOT_MEASURE_FEEDS: ${{ vars.PBOT_MEASURE_FEEDS || 'icehockey_nhl,basketball_nba,basketball_ncaab' }}
          PBOT_MEASURE_DAILY_CREDIT_CAP: ${{ vars.PBOT_MEASURE_DAILY_CREDIT_CAP || '2' }}
          # Per-game pull targets (T-24h/T-6h/T-90m/T-10m) may spend the share of each
          # day's credits the rotation does not keep; 'off' disables the plan.
          PBOT_ODDS_PULL_PLAN: ${{ vars.PBOT_ODDS_PULL_PLAN || 'hybrid' }}
          PBOT_ODDS_ENTRY_SHARE: ${{ vars.PBOT_ODDS_ENTRY_SHARE || '0.5' }}
          # flat = one max_order_notional unit per entry; kelly = quarter-Kelly on an edge
          # capped at half the v3 cohort's mean CLV, only once that cohort is supported.
          PBOT_SIZING_MODE: ${{ vars.PBOT_SIZING_MODE || 'flat' }}
          # Hard stops: flip the repo variable PBOT_KILL_SWITCH to "true" to halt all entries.
          PBOT_KILL_SWITCH: ${{ vars.PBOT_KILL_SWITCH || 'false' }}
          PBOT_MAX_DAILY_LOSS: ${{ vars.PBOT_MAX_DAILY_LOSS || '50' }}
          # Injury gate starts in log: trades are tagged injury_gate_would_block so
          # the dashboard can compare their CLV before we ever flip to block.
          PBOT_INJURY_GATE: ${{ vars.PBOT_INJURY_GATE || 'log' }}
          # Credit cadence defaults to the calendar blend; set to 'legacy' to
          # reproduce the old flat per-slot share, or 'off' for static only.
          PBOT_CADENCE_MODE: ${{ vars.PBOT_CADENCE_MODE || 'calendar' }}
          PBOT_CADENCE_DAY_OVERRIDE: ${{ vars.PBOT_CADENCE_DAY_OVERRIDE || '' }}
          PBOT_ODDS_API_KEY: ${{ secrets.PBOT_ODDS_API_KEY }}
          # Twelve sportsbook slots a day: each spends only its share of the free-tier quota
          # left this month, on feeds whose games can clear min_lead_hours.
          PBOT_ODDS_RUNS_PER_DAY: "12"
          # github.event.schedule is the cron expression that fired, so slot selection is
          # immune to delayed starts; manual runs always include the sportsbook strategy.
          SPORTSBOOK_SLOT: ${{ inputs.slot == 'sportsbook' || (github.event_name == 'workflow_dispatch' && inputs.slot == '') || github.event.schedule == '17 */2 * * *' }}
        run: |
          set -eo pipefail
          SPORTSBOOK_SERIES_ARGS="$(python -c 'from prediction_bot.series import SPORTSBOOK_SERIES; print(" ".join(f"--series {series}" for series in SPORTSBOOK_SERIES))')"
          pbot paper -s book_scanner --cycles 1 | tee ledger/last_run.txt
          if [ -n "$PBOT_ODDS_API_KEY" ] && [ "$SPORTSBOOK_SLOT" = true ]; then
            if [ "$PBOT_RULES_VERSION" = "v3" ]; then
              pbot paper -s sportsbook_v3 --cycles 1 $SPORTSBOOK_SERIES_ARGS \
                | tee -a ledger/last_run.txt
            elif [ "$PBOT_RULES_VERSION" = "v2" ]; then
              PBOT_SHADOW_STRATEGIES=sportsbook_arb,underdog_value pbot paper \
                -s sportsbook_v2 --cycles 1 $SPORTSBOOK_SERIES_ARGS \
                | tee -a ledger/last_run.txt
            else
              pbot paper -s sportsbook_arb -s underdog_value --cycles 1 \
                $SPORTSBOOK_SERIES_ARGS \
                | tee -a ledger/last_run.txt
            fi
          fi
          if [ -n "$PBOT_ODDS_API_KEY" ] && [ "$SPORTSBOOK_SLOT" != true ] \
            && [ "$PBOT_RULES_VERSION" = "v3" ]; then
            # A due pull-plan target (e.g. a T-10m sharp close) wins over a move trigger.
            PLAN_FEED="$(pbot pull-due)" || PLAN_FEED=""
            if [ -n "$PLAN_FEED" ]; then
              pbot paper -s sportsbook_v3 --cycles 1 $SPORTSBOOK_SERIES_ARGS \
                --plan "$PLAN_FEED" | tee -a ledger/last_run.txt || true
            else
              FEED="$(pbot odds-trigger $SPORTSBOOK_SERIES_ARGS)" || FEED=""
              if [ -n "$FEED" ]; then
                pbot paper -s sportsbook_v3 --cycles 1 $SPORTSBOOK_SERIES_ARGS \
                  --trigger "$FEED" | tee -a ledger/last_run.txt || true
              fi
            fi
          fi
          pbot report | tee ledger/REPORT.txt
          pbot predictions --limit 0 --markdown ledger/PREDICTIONS.md >/dev/null
          pbot dashboard --out ledger/index.html >/dev/null
          pbot reference-gaps > ledger/polymarket_alias_gaps.md || true
          touch ledger/.nojekyll

      - name: Commit ledger
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -e
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          if git rev-parse -q --verify paper-ledger >/dev/null; then
            git worktree add wt paper-ledger
          else
            git worktree add --detach wt HEAD
            (cd wt && git checkout -q --orphan paper-ledger && git rm -rfq .)
          fi
          cp ledger/paper.sqlite ledger/last_run.txt ledger/REPORT.txt ledger/PREDICTIONS.md \
             ledger/index.html ledger/.nojekyll ledger/polymarket_alias_gaps.md wt/
          cd wt
          git add paper.sqlite last_run.txt REPORT.txt PREDICTIONS.md index.html .nojekyll \
            polymarket_alias_gaps.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "paper cycle $(date -u +%FT%TZ)"
          git push origin paper-ledger
