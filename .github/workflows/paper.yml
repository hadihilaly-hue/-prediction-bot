name: Paper trading

# Paper-trades against Kalshi's *public production* market data (real prices, no
# credentials, paper mode never places orders) and persists the SQLite ledger +
# report on the `paper-ledger` branch. The book scanner runs every 30 min (free on a
# public repo); the sportsbook strategy only on the 3 daily slots so The Odds API
# usage (3 runs x 4 sports x 31 days = 372 req/month) stays inside the free 500 tier.
# Manual runs always include the sportsbook strategy.
on:
  schedule:
    - cron: "17 3,11,19 * * *"  # book scanner + sportsbook
    - cron: "47 * * * *"  # book scanner only
    - cron: "17 0-2,4-10,12-18,20-23 * * *"  # book scanner only
  workflow_dispatch:

concurrency:
  group: paper-ledger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Restore ledger branch
        run: |
          git fetch origin paper-ledger:paper-ledger 2>/dev/null || true
          mkdir -p ledger
          git show paper-ledger:paper.sqlite > ledger/paper.sqlite 2>/dev/null || true

      - name: Run one paper cycle
        env:
          PBOT_MODE: paper
          PBOT_KALSHI_API_BASE: https://api.elections.kalshi.com/trade-api/v2
          PBOT_PAPER_DB_PATH: ledger/paper.sqlite
          # 1c after fees: the default 3c found nothing; we want data on small edges too.
          PBOT_MIN_EDGE: "0.01"
          PBOT_ODDS_API_KEY: ${{ secrets.PBOT_ODDS_API_KEY }}
          # github.event.schedule is the cron expression that fired, so slot selection is
          # immune to delayed starts; manual runs always include the sportsbook strategy.
          SPORTSBOOK_SLOT: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3,11,19 * * *' }}
        run: |
          set -eo pipefail
          pbot paper -s book_scanner --cycles 1 | tee ledger/last_run.txt
          if [ -n "$PBOT_ODDS_API_KEY" ] && [ "$SPORTSBOOK_SLOT" = true ]; then
            pbot paper -s sportsbook_arb -s underdog_value --cycles 1 \
              --series KXNFLGAME --series KXNCAAFGAME --series KXNBAGAME --series KXNHLGAME \
              --series KXMLBGAME \
              --series KXMASTERS --series KXPGA --series KXUSOPEN --series KXTHEOPEN \
              | tee -a ledger/last_run.txt
          fi
          pbot report | tee ledger/REPORT.txt
          pbot predictions --limit 0 --markdown ledger/PREDICTIONS.md >/dev/null
          pbot dashboard --out ledger/index.html >/dev/null
          touch ledger/.nojekyll

      - name: Commit ledger
        run: |
          set -e
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          if git rev-parse -q --verify paper-ledger >/dev/null; then
            git worktree add wt paper-ledger
          else
            git worktree add --detach wt HEAD
            (cd wt && git checkout -q --orphan paper-ledger && git rm -rfq .)
          fi
          cp ledger/paper.sqlite ledger/last_run.txt ledger/REPORT.txt ledger/PREDICTIONS.md \
             ledger/index.html ledger/.nojekyll wt/
          cd wt
          git add paper.sqlite last_run.txt REPORT.txt PREDICTIONS.md index.html .nojekyll
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "paper cycle $(date -u +%FT%TZ)"
          git push origin paper-ledger
